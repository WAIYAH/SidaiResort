<header id="site-header" x-data="{ mobileOpen: false }"
        class="fixed top-0 inset-x-0 z-50 transition-all duration-300">
        <div class="sidai-container">
            <nav class="mt-3 sm:mt-4 rounded-2xl border border-gold/30 bg-cream/70 px-3 sm:px-4 py-2.5 sm:py-3 backdrop-blur-lg shadow-lg"
                aria-label="Primary">
                <div class="flex items-center justify-between gap-2 sm:gap-4 min-w-0">
                    <a href="/" class="home-brand-link flex items-center gap-2 sm:gap-3 min-w-0"
                        aria-label="Sidai Resort Home - Return to top">
                        <img src="assets/images/branding/sidai-logo.png" alt="Sidai Resort & Hotel logo Naroosura Kenya"
                            class="brand-logo h-10 w-10 sm:h-12 sm:w-12 object-cover flex-shrink-0 rounded-full border border-gold/40 bg-cream/80 p-0.5 shadow-sm"
                            loading="lazy" width="445" height="440">
                        <span class="brand-identity min-w-0">
                            <span class="brand-name block font-display text-xl sm:text-2xl text-brown truncate">Sidai
                                Resort</span>
                            <span
                                class="brand-tagline block text-[8px] sm:text-[10px] uppercase tracking-[0.2em] sm:tracking-[0.3em] text-forest truncate mt-1">Nothing
                                But the Best</span>
                        </span>
                    </a>

                    <div class="hidden lg:flex items-center gap-1" id="desktop-nav-links">
                        <a href="/"
                            class="header-link rounded-full px-4 py-2 text-sm font-medium transition-colors text-brown hover:text-gold hover:bg-night/70">
                            Home </a>
                        <a href="/services"
                            class="header-link rounded-full px-4 py-2 text-sm font-medium transition-colors text-brown hover:text-gold hover:bg-night/70">
                            Services </a>
                        <a href="/experiences"
                            class="header-link rounded-full px-4 py-2 text-sm font-medium transition-colors text-brown hover:text-gold hover:bg-night/70">
                            Moments </a>
                        <a href="/rooms"
                            class="header-link rounded-full px-4 py-2 text-sm font-medium transition-colors text-brown hover:text-gold hover:bg-night/70">
                            Accommodation </a>
                        <a href="/menu"
                            class="header-link rounded-full px-4 py-2 text-sm font-medium transition-colors text-brown hover:text-gold hover:bg-night/70">
                            Menus </a>
                        <a href="/about"
                            class="header-link rounded-full px-4 py-2 text-sm font-medium transition-colors text-brown hover:text-gold hover:bg-night/70">
                            About Us </a>
                    </div>

                    <div id="desktop-nav-cta" class="hidden lg:flex items-center gap-2">

                        <a href="/booking"
                            class="ml-1 inline-flex items-center rounded-full bg-gold px-5 py-2.5 text-sm font-semibold text-night hover:bg-gold-light transition-colors">Book
                            Now</a>
                    </div>

                    <button type="button"
                        class="home-menu-toggle lg:hidden inline-flex h-10 w-10 sm:h-11 sm:w-11 items-center justify-center rounded-full border border-brown/25 bg-cream/90 text-brown flex-shrink-0"
                        aria-label="Main Menu" @click="mobileOpen = !mobileOpen" :aria-expanded="mobileOpen.toString()">
                        <span x-show="!mobileOpen" x-cloak>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" class="h-5 w-5 sm:h-6 sm:w-6">
                                <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
                            </svg>
                        </span>
                        <span x-show="mobileOpen" x-cloak>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" class="h-5 w-5 sm:h-6 sm:w-6">
                                <path stroke-linecap="round" d="m6 6 12 12M6 18 18 6" />
                            </svg>
                        </span>
                    </button>
                </div>

                <div x-show="mobileOpen" x-cloak x-transition.origin.top
                    class="lg:hidden mt-3 border-t border-gold/20 pt-3" id="mobile-menu">
                    <div class="space-y-1.5">
                        <a href="/"
                            class="flex items-center rounded-xl px-4 py-3 text-sm font-medium transition-colors bg-white/60 text-brown hover:bg-white/80"
                            @click="mobileOpen = false">
                            Home </a>
                        <a href="/services"
                            class="flex items-center rounded-xl px-4 py-3 text-sm font-medium transition-colors bg-white/60 text-brown hover:bg-white/80"
                            @click="mobileOpen = false">
                            Services </a>
                        <a href="/experiences"
                            class="flex items-center rounded-xl px-4 py-3 text-sm font-medium transition-colors bg-white/60 text-brown hover:bg-white/80"
                            @click="mobileOpen = false">
                            Moments </a>
                        <a href="/rooms"
                            class="flex items-center rounded-xl px-4 py-3 text-sm font-medium transition-colors bg-white/60 text-brown hover:bg-white/80"
                            @click="mobileOpen = false">
                            Accommodation </a>
                        <a href="/menu"
                            class="flex items-center rounded-xl px-4 py-3 text-sm font-medium transition-colors bg-white/60 text-brown hover:bg-white/80"
                            @click="mobileOpen = false">
                            Menus </a>
                        <a href="/about"
                            class="flex items-center rounded-xl px-4 py-3 text-sm font-medium transition-colors bg-white/60 text-brown hover:bg-white/80"
                            @click="mobileOpen = false">
                            About Us </a>
                        <a href="/booking"
                            class="flex items-center justify-center rounded-xl bg-gold px-4 py-3 text-sm font-semibold text-night hover:bg-gold-light transition-colors"
                            @click="mobileOpen = false">
                            Book Now
                        </a>

                    </div>
                </div>
            </nav>
        </div>
    </header>
